name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release candidate
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      RUNTIME_ROOT: plugins/local-knowledge-suite/runtime

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch canonical main branch
        shell: powershell
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main

      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: plugins/local-knowledge-suite/runtime/uv.lock

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve release version
        id: version
        # PowerShell 7 writes GitHub command files as UTF-8. Windows
        # PowerShell 5.1 redirects with UTF-16LE, which GitHub cannot parse.
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify annotated tag provenance
        shell: powershell
        run: >-
          ./tools/release/Test-ReleaseProvenance.ps1
          -TagName "$env:GITHUB_REF_NAME"

      - name: Validate release metadata and public source
        shell: powershell
        run: >-
          ./tools/release/Test-Release.ps1
          -ExpectedVersion "$env:RELEASE_VERSION"

      - name: Test strict release policy
        shell: powershell
        run: ./tools/release/Test-ReleasePolicySelfTest.ps1

      - name: Check out pinned official OpenAI Skill validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .release-tools/openai-skills
          persist-credentials: false
          sparse-checkout: skills/.system/skill-creator

      - name: Check out pinned official OpenAI plugin validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openai/codex
          ref: f9b18d04ba78266b1e802ae2f85ff5ebea1e973a
          path: .release-tools/openai-codex
          persist-credentials: false
          sparse-checkout: codex-rs/skills/src/assets/samples/plugin-creator

      - name: Run official plugin validator
        shell: powershell
        run: >-
          uv run --no-project --with PyYAML==6.0.3 python
          .release-tools/openai-codex/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          plugins/local-knowledge-suite

      - name: Validate company knowledge skill
        shell: powershell
        run: >-
          uv run --no-project --with PyYAML==6.0.3 python
          .release-tools/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py
          plugins/local-knowledge-suite/skills/company-knowledge-base

      - name: Validate project routing skill
        shell: powershell
        run: >-
          uv run --no-project --with PyYAML==6.0.3 python
          .release-tools/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py
          plugins/local-knowledge-suite/skills/manage-local-knowledge

      - name: Validate project memory skill
        shell: powershell
        run: >-
          uv run --no-project --with PyYAML==6.0.3 python
          .release-tools/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py
          plugins/local-knowledge-suite/skills/memorizer

      - name: Synchronize pinned Python runtime
        shell: powershell
        run: >-
          uv sync --project $env:RUNTIME_ROOT --frozen
          --extra build --extra dev

      - name: Verify MCP initialize and tools contract
        shell: powershell
        run: ./tools/release/Test-McpHandshake.ps1

      - name: Smoke test actual vendored installer
        shell: powershell
        run: ./tools/release/Test-VendoredInstall.ps1

      - name: Run Python and portable tests
        shell: powershell
        run: |
          $env:PYTHONPATH = (Resolve-Path "$env:RUNTIME_ROOT/src").Path
          uv run --project $env:RUNTIME_ROOT --frozen `
            --extra build --extra dev python -m pytest tests

      - name: Install pinned JavaScript workspace
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Type-check portal
        shell: powershell
        run: pnpm typecheck

      - name: Build portal and VitePress documentation
        shell: powershell
        run: pnpm build

      - name: Package portal
        shell: powershell
        run: ./plugins/local-knowledge-suite/scripts/Build-LocalKnowledgePortal.ps1

      - name: Verify packaged portal is current
        shell: powershell
        run: |
          $portalStatus = @(
            git status --porcelain --untracked-files=all -- `
              plugins/local-knowledge-suite/runtime/src/local_knowledge/portal
          )
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($portalStatus.Count -gt 0) {
            $portalStatus | Write-Output
            throw "The packaged portal differs from the pinned web build."
          }

      - name: Test dependency license policy
        shell: powershell
        run: ./tools/release/Test-LicenseGateSelfTest.ps1

      - name: Create release evidence directory
        shell: powershell
        run: New-Item -ItemType Directory -Path artifacts -Force | Out-Null

      - name: Generate Python license inventory
        shell: powershell
        run: >-
          uv run --project $env:RUNTIME_ROOT --frozen
          --extra build --extra dev python
          tools/release/python_license_report.py
          --output artifacts/python-licenses.json

      - name: Self-test deterministic Node dependency inventory
        shell: powershell
        run: python tools/release/test_node_license_report.py

      - name: Generate installed Node dependency inventory
        shell: powershell
        run: >-
          python tools/release/node_license_report.py
          --output artifacts/node-licenses.json

      - name: Enforce dependency license allowlist
        shell: powershell
        run: |
          ./tools/release/Test-DependencyLicenses.ps1 `
            -PythonReport artifacts/python-licenses.json `
            -NodeReport artifacts/node-licenses.json

      - name: Stage and package full-source product
        shell: powershell
        run: >-
          ./tools/release/New-Release.ps1
          -Version "$env:RELEASE_VERSION"

      - name: Generate CycloneDX SBOM from shipped product
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: artifacts/staged-product-v${{ steps.version.outputs.version }}
          format: cyclonedx-json
          output-file: artifacts/local-knowledge-suite-v${{ steps.version.outputs.version }}-sbom.cdx.json
          syft-version: v1.33.0
          upload-artifact: false
          upload-release-assets: false

      - name: Normalize and validate SBOM product metadata
        shell: powershell
        run: |
          ./tools/release/Normalize-CycloneDxSbom.ps1 `
            -Path "artifacts/local-knowledge-suite-v$env:RELEASE_VERSION-sbom.cdx.json" `
            -Version "$env:RELEASE_VERSION"

      - name: Create final checksums
        shell: powershell
        run: ./tools/release/Write-ReleaseChecksums.ps1

      - name: Verify final release assets
        shell: powershell
        run: |
          ./tools/release/Test-ReleaseArtifacts.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -RequireSbom

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: local-knowledge-suite-v${{ steps.version.outputs.version }}
          path: |
            artifacts/*.json
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish verified release candidate
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      RELEASE_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Check out tagged source without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch canonical main branch
        shell: powershell
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main

      - name: Verify annotated tag provenance
        shell: powershell
        run: >-
          ./tools/release/Test-ReleaseProvenance.ps1
          -TagName "$env:GITHUB_REF_NAME"

      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-knowledge-suite-v${{ needs.build.outputs.version }}
          path: artifacts

      - name: Reconstruct shipped-product evidence
        shell: powershell
        run: |
          $version = $env:RELEASE_VERSION
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Downloaded candidate version does not match the release tag."
          }
          $bundle = "artifacts/local-knowledge-suite-v$version.zip"
          $stage = "artifacts/staged-product-v$version"
          if (-not (Test-Path -LiteralPath $bundle -PathType Leaf)) {
            throw "Downloaded release bundle is missing: $bundle"
          }
          if (Test-Path -LiteralPath $stage) {
            throw "Publish staging path must not already exist: $stage"
          }
          Expand-Archive -LiteralPath $bundle -DestinationPath $stage
          $manifest = (
            Get-Content -LiteralPath "$stage\plugins\local-knowledge-suite\.codex-plugin\plugin.json" `
              -Raw -Encoding UTF8 |
              ConvertFrom-Json
          )
          if ([string]$manifest.version -cne $version) {
            throw "Downloaded candidate plugin version does not match the build output."
          }

      - name: Verify downloaded release candidate
        shell: powershell
        run: |
          ./tools/release/Test-ReleaseArtifacts.ps1 `
            -Version "$env:RELEASE_VERSION" `
            -RequireSbom

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            throw "No release artifacts were generated."
          }

          $preamblePath = "docs/RELEASE_NOTES_PREAMBLE.md"
          $requiredDisclaimer = (
            "Annotated-tag/main-head binding and SHA-256 checks provide provenance and integrity only " +
            "against the trusted GitHub Release channel. They are not a cryptographic " +
            "signature or an independent attestation."
          )
          $preamble = Get-Content -LiteralPath $preamblePath -Raw -Encoding UTF8
          if ($preamble.IndexOf(
            $requiredDisclaimer,
            [System.StringComparison]::Ordinal
          ) -lt 0) {
            throw "Release notes preamble is missing the required integrity disclaimer."
          }
          $releaseCommit = @(
            git rev-parse --verify "$env:GITHUB_REF_NAME^{commit}"
          )
          if ($LASTEXITCODE -ne 0 -or $releaseCommit.Count -ne 1) {
            throw "Annotated release tag did not peel to exactly one commit."
          }

          $generatedJson = @(
            & gh api --method POST `
              "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              -f "tag_name=$env:GITHUB_REF_NAME" `
              -f "target_commitish=$($releaseCommit[0])"
          )
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $generated = ($generatedJson -join "`n") | ConvertFrom-Json
          $notesBody = $preamble.TrimEnd()
          if (-not [string]::IsNullOrWhiteSpace([string]$generated.body)) {
            $notesBody += "`n`n" + ([string]$generated.body).Trim()
          }
          if ($notesBody.IndexOf(
            $requiredDisclaimer,
            [System.StringComparison]::Ordinal
          ) -lt 0) {
            throw "Release notes lost the required integrity disclaimer."
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "local-knowledge-suite-release-notes.md"
          [System.IO.File]::WriteAllText(
            $notesFile,
            $notesBody + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

          & gh release create $env:GITHUB_REF_NAME @files `
            --verify-tag `
            --title "Local Knowledge Suite $env:GITHUB_REF_NAME" `
            --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
